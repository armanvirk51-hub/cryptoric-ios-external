# Cryptoric — updated 2026-10-05
name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build Unsigned IPA
        run: |
          chmod +x build_unsigned.sh build_esign_ready_ipa.sh
          ./build_unsigned.sh
          ./build_esign_ready_ipa.sh build/Cryptoric-unsigned.ipa

      - name: Upload Finished IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cryptoric-ESign-Ready-IPA
          path: build/Cryptoric-unsigned.ipa
          retention-days: 7

 
